name: Metrics
on:
  schedule: [{cron: "0 18 * * *"}]  # 15h BRT - quota reseta a cada hora, horário menos concorrido
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:

      # 1. Métricas Gerais
      - name: General Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          repositories_batch: 50        # era 100 por padrão - economiza REST calls

      # 2. Ícones de Tópicos/Tecnologias
      - name: Icons
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.topics.icons.svg
          token: NOT_NEEDED             # não consome quota, ok
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons

      # 3. Calendário
      - name: Full-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # 4. Análise profunda de linguagens (maior consumidor de quota)
      - name: Indepth analysis
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.languages.indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake,
            gnuplot
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size
          plugin_languages_limit: 10
          plugin_languages_analysis_timeout: 30   # aumenta pra não cortar análise
          plugin_languages_analysis_timeout_repositories: 10  # limite por repo
          repositories_skipped: >-               # coloque aqui os repos pesados
            Rondi650/FORMACAO-PRATICANDO-PY,
            Rondi650/PostgreeSQL-e-FAST-API,
            Rondi650/introducao_ao_django_conteitos_basicos,
            Rondi650/cursopython2023

      # 5. WakaTime
      - name: WakaTime
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.wakatime.svg
          token: NOT_NEEDED             # não consome quota, ok
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
